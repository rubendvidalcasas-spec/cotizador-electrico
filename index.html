<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cotizador Eléctrico</title>
<meta name="theme-color" content="#12233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotizador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: app de una pantalla tipo celular. Cabecera fija con el total, zona central con scroll, barra de pestañas abajo. */
:root{
  --bg:#E9EEF5; --panel:#FFFFFF; --ink:#14233B; --muted:#586A85; --line:#D3DCE8;
  --accent:#1554C8; --accent-ink:#FFFFFF; --soft:#E2EBFA;
  --head:#12233F; --head-ink:#F2F6FC; --head-muted:#A9B9D3;
  --warn:#9A4A06; --warn-bg:#FCEFD8; --ok:#17713F;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A111D; --panel:#131D30; --ink:#E6ECF5; --muted:#94A4BE; --line:#27354E;
  --accent:#74A6FF; --accent-ink:#0B1626; --soft:#1A2A47;
  --head:#070D18; --head-ink:#F2F6FC; --head-muted:#94A4BE;
  --warn:#F2B866; --warn-bg:#33270F; --ok:#5CCB8F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A111D; --panel:#131D30; --ink:#E6ECF5; --muted:#94A4BE; --line:#27354E;
  --accent:#74A6FF; --accent-ink:#0B1626; --soft:#1A2A47;
  --head:#070D18; --head-ink:#F2F6FC; --head-muted:#94A4BE;
  --warn:#F2B866; --warn-bg:#33270F; --ok:#5CCB8F; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.head{background:var(--head);color:var(--head-ink);padding-block:12px 14px;display:flex;flex-direction:column;gap:6px}
.head-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.badge{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--head-muted);border:1px solid var(--head-muted);border-radius:3px;padding:1px 6px;white-space:nowrap}
.total-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.total-lbl{font-size:12px;color:var(--head-muted)}
.total{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.head-meta{font-size:12.5px;color:var(--head-muted);text-align:right;font-variant-numeric:tabular-nums}

.screen{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px}
.tab{display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lbl{min-width:0;flex:1}
.row .lbl b{font-weight:600;display:block}
.hint{font-size:12.5px;color:var(--muted);display:block}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.step button:active{background:var(--soft)}
.step input{width:62px;height:40px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:disabled,.step button:disabled{opacity:.55;cursor:default}
.unit{font-size:12px;color:var(--muted);width:22px}
.text-in{width:100%;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 12px;font-weight:600}
.zrow{gap:8px}
.zname{flex:1;min-width:0;height:40px;padding:0 8px;font-weight:500;font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 30%;min-height:52px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-weight:600;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] small{color:var(--accent-ink)}
.chk{width:22px;height:22px;accent-color:var(--accent);flex:none}
details.group summary{padding:12px;cursor:pointer;font-weight:600}
details.group[open] summary{border-bottom:1px solid var(--line)}

.note{font-size:13px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-size:13.5px;font-weight:500}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv div{background:var(--panel);padding:10px 12px;min-width:0}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kv small{display:block;font-size:12px;color:var(--muted)}

/* Riel DIN: cada columna es un polo */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.mod{border:1px solid var(--ink);border-radius:3px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.15;text-align:center;overflow:hidden;font-variant-numeric:tabular-nums}
.mod b{font-family:var(--f-display);font-size:14px}
.mod.gen{background:var(--ink);color:var(--panel)}
.mod.dif{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.mod.free{border:1px dashed var(--line);color:var(--muted);min-height:54px}
.panel-fig svg{display:block;max-width:100%;height:auto}
.legend{align-items:center;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.sub{font-size:12px;color:var(--muted);display:block}
.sec-head{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;background:var(--soft);font-weight:600;font-size:13.5px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--muted);vertical-align:-1px;margin-right:7px}
.c-rojo{background:#D62F2F}.c-negro{background:#161616}.c-azul{background:#2563EB}.c-blanco{background:#FFFFFF}
.c-verde{background:linear-gradient(90deg,#1E9E4A 50%,#F2D21B 50%)}.c-naranja{background:#F08A1C}

.tot{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.tot div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tot div:first-child{border-top:0}
.tot .grand{background:var(--head);color:var(--head-ink);font-family:var(--f-display);font-size:24px;font-weight:700;border-radius:0 0 5px 5px;align-items:baseline}
.btn{min-height:46px;border-radius:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;padding:0 16px;width:100%}
.btn2{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:12.5px/1.4 ui-monospace,Consolas,monospace;padding:10px}
.fx{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px}
.fx b{font-weight:600}
.fx code{font:600 13.5px/1.4 ui-monospace,Consolas,monospace;color:var(--accent);overflow-wrap:anywhere}
.fx span{font-size:13px;color:var(--muted)}

.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-height:54px;border:0;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border-top:3px solid transparent;padding:4px 1px}
.sec-uso{padding:6px 10px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.mline{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap;font-size:12.5px;line-height:1.6}
.mline .dot{margin-right:2px}
.trtot td{font-weight:700;background:var(--soft)}
.pasos{margin:10px 0 6px;padding-left:22px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.step button.mini{width:auto;padding:0 10px;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header class="head gut">
    <div class="head-top"><span class="brand">Cotizador Eléctrico</span><span class="badge" id="badge-ver">versión 15</span></div>
    <div class="total-row">
      <div><div class="total-lbl" id="h-lbl">Total cotización</div><div class="total" id="h-total">S/ 0</div></div>
      <div class="head-meta" id="h-meta"></div>
    </div>
  </header>

  <main class="screen gut" id="screen">
    <section class="tab" id="t-datos"></section>
    <section class="tab" id="t-tablero" hidden></section>
    <section class="tab" id="t-metrado" hidden></section>
    <section class="tab" id="t-cotiza" hidden></section>
    <section class="tab" id="t-formulas" hidden></section>
    <section class="tab" id="t-archivo" hidden></section>
  </main>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="datos" aria-selected="true">Datos</button>
    <button role="tab" data-tab="tablero" aria-selected="false">Tablero</button>
    <button role="tab" data-tab="metrado" aria-selected="false">Metrado</button>
    <button role="tab" data-tab="cotiza" aria-selected="false">Cotizar</button>
    <button role="tab" data-tab="formulas" aria-selected="false">Normas</button>
    <button role="tab" data-tab="archivo" aria-selected="false">Archivo</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
const APP_VERSION = 15;   // subir junto con VERSION en sw.js en cada publicación
/* ---------- Estado (ejemplo cargado) ---------- */
const DEF = {
  cliente:'Ejemplo: vivienda de 2 pisos', sistema:'mono', difModo:'general', area:120, pisos:2, dist:15,
  luz:18, intS:10, conm:2, tomas:22, tomasC:6,
  ducha:1, therma:0, cocina:0, aire:0, bomba:1, lavadora:0,
  util:0, igv:false, pozo:true, pPozo:350, soloMO:false, modo:'cableado', tabExiste:false,
  zona:1, zonas:[{n:'Económica: Carabayllo, Comas, SJL',p:25},{n:'Media: Los Olivos, SMP, Cercado',p:30},{n:'Media alta: Surco, Jesús María, Pueblo Libre',p:38},{n:'Exclusiva: Miraflores, San Isidro, La Molina',p:45}],
  piso:'Piso 1', pp:30, pEsp:90, pAlim:160, pDisp:25, pTubo:50, pLum:0,
  H:2.5, hInt:1.3, hToma:0.4, hCoc:1.1, hTab:1.7, punta:0.2,
  auto:true, mLuz:3.4, mToma:2.7, mHome:4.6, mEsp:12, desp:10, maxC:12
};
let S = Object.assign({}, DEF);
try { const g = JSON.parse(localStorage.getItem('cotiz-elec-v2')); if (g) S = Object.assign(S, g); } catch(e){}
const save = () => { try { localStorage.setItem('cotiz-elec-v2', JSON.stringify(S)); } catch(e){} };

/* ---------- Tablas técnicas (referenciales) ---------- */
const AMP = [[2.5,18],[4,25],[6,32],[10,44],[16,60],[25,80],[35,100],[50,125]]; // mm², A en tubo
const ITM = [16,20,25,32,40,50,63,80,100,125];
const TAB = [12,24,36,48,60];
const ESP = {
  ducha:{n:'Ducha eléctrica',w:5500,t:'agua'}, therma:{n:'Therma',w:2000,t:'agua'},
  cocina:{n:'Cocina eléctrica o de inducción',w:7000,t:'coc'}, aire:{n:'Aire acondicionado',w:1800,t:'ac'},
  bomba:{n:'Electrobomba 1 HP',w:750,t:'menor'}, lavadora:{n:'Lavaseca o secadora',w:2500,t:'otra'}
};
/* Precios de ejemplo en soles: se reemplazan por la lista real del negocio */
const P = {
  cable:{2.5:2.1,4:3.3,6:5,10:8.8,16:13.5,25:21,35:29,50:41},
  tubo20:10, tubo25:15, tubo35:22, curva:1.5, conector:1, octo:3, rect:2.5, pegamento:12,
  placaInt:25, placaConm:30, toma:30, id40:150, id63:190, pozo:650,
  tablero:{4:90,8:180,12:280,18:360,24:450,36:620,48:800,60:980},
  cinta:6, vulc:18, pin:0.3, ojo:3, empalme:1.2, lubricante:15, cintillos:8, peine:25, etiquetas:10,
  mo:{
    cableado:{luz:45,int:15,conm:45,toma:40,esp:70,alim:6},
    completo:{luz:90,int:20,conm:60,toma:80,esp:150,alim:10},
    tabBase:150, tabPolo:15, pozo:350
  }
};
const itmPrecio = (a,p) => p===2 ? (a<=32?45:a<=63?70:150) : p===3 ? (a<=63?120:260) : (a<=63?160:320);
const MODO = {cableado:{n:'Solo cableado',c:'Tubos y cajas ya empotrados'}, completo:{n:'Instalación completa',c:'Con tubería y cajas'}};

const SIS = {
  mono:{n:'Monofásico 220 V',c:'2 hilos',polos:2},
  tri220:{n:'Trifásico 220 V',c:'3 hilos',polos:3},
  tri380:{n:'Trifásico 380/220 V',c:'3 fases + neutro',polos:4}
};
const next = (arr,v) => arr.find(x => x>=v) || arr[arr.length-1];
const secFor = a => (AMP.find(x => x[1]>=a) || AMP[AMP.length-1])[0];
const tierraFor = a => a<=20 ? 2.5 : a<=32 ? 4 : a<=63 ? 6 : 10;
// Tierra de un tramo: mismo calibre que sus fases hasta 16 mm²; 16 mm² hasta 35 mm²; la mitad por encima
const peDe = sec => sec<=16 ? sec : sec<=35 ? 16 : Math.round(sec/2);
const AWG = {2.5:'≈ 14 AWG', 4:'≈ 12 AWG', 6:'≈ 10 AWG', 10:'≈ 8 AWG', 16:'≈ 6 AWG', 25:'≈ 4 AWG', 35:'≈ 2 AWG', 50:'≈ 1/0 AWG'};
const ampDe = sec => (AMP.find(a => a[0]===sec) || [0,0])[1];

/* ---------- Motor de cálculo ---------- */
function compute(){
  const s = S, V = 220, circ = [];
  const reparte = (total, nombre, wPunto, itm, maxPor, minCirc, k) => {
    if (total <= 0) return;
    const n = Math.max(Math.ceil(total/maxPor), Math.min(minCirc, total));
    for (let i=0;i<n;i++){
      const pts = Math.floor(total/n) + (i < total%n ? 1 : 0), w = pts*wPunto;
      circ.push({k, nombre: nombre+(n>1?' '+(i+1):''), det: pts+' puntos', pts, w, i:w/V, itm, sec:secFor(itm), tierra:peDe(secFor(itm))});
    }
  };
  reparte(s.luz, 'Iluminación', 100, 16, s.maxC, s.pisos, 'L');
  reparte(s.tomas, 'Tomacorrientes', 180, 20, s.maxC, s.pisos, 'T');
  reparte(s.tomasC, 'Tomas cocina y lavandería', 180, 20, 6, 1, 'C');
  let nEsp = 0; const espCirc = [];
  for (const k in ESP) for (let j=0;j<s[k];j++){
    const e = ESP[k], i = e.w/V, itm = next(ITM, i*1.25);
    const c = {nombre:e.n+(s[k]>1?' '+(j+1):''), det:'circuito propio', w:e.w, i, itm, sec:secFor(itm), tierra:peDe(secFor(itm))};
    circ.push(c); espCirc.push(c); nEsp++;
  }

  // Demanda máxima, método CNE-U 050-200
  const basica = 2500 + (s.area>90 ? Math.ceil((s.area-90)/90)*1000 : 0);
  const dCoc = s.cocina>0 ? 6000*s.cocina : 0;
  const dAgua = s.ducha*ESP.ducha.w + s.therma*ESP.therma.w;
  const dAC = s.aire*ESP.aire.w;
  const otras = s.lavadora*ESP.lavadora.w;
  const dOtras = s.cocina>0 ? otras*0.25 : Math.min(otras,6000) + Math.max(otras-6000,0)*0.25;
  const demanda = basica + dCoc + dAgua + dAC + dOtras;

  const sis = SIS[s.sistema], tri = s.sistema!=='mono', Vn = s.sistema==='tri380' ? 380 : 220;
  const I = tri ? demanda/(Math.sqrt(3)*Vn) : demanda/Vn;
  const maxDer = circ.reduce((m,c) => Math.max(m,c.itm), 0);
  const gen = next(ITM, Math.max(I, maxDer+1, 25));
  let idx = AMP.findIndex(x => x[1]>=Math.max(gen,40)); if (idx<0) idx = AMP.length-1; // mínimo 40 A, regla 050-200(1)(b)
  const k = tri ? Math.sqrt(3) : 2;
  const dv = sec => k*0.0175*s.dist*I/sec/Vn*100;
  while (dv(AMP[idx][0])>2.5 && idx<AMP.length-1) idx++;
  const fs = AMP[idx][0], caida = dv(fs), tGen = peDe(fs);

  const difGen = s.difModo==='general', porCirc = s.difModo==='circuito' && circ.length>0, idDe = a => a<=25 ? 25 : a<=40 ? 40 : 63;
  const nID = porCirc ? circ.length : difGen ? 1 : Math.max(1, Math.ceil(circ.length/3)), idA = gen<=40 ? 40 : 63;
  const usados = sis.polos + (difGen ? sis.polos : nID*2) + circ.length*2;
  const tamG = reparteGrupos(circ.length, nID);
  const tablero = Math.max(next(TAB, Math.max(12, Math.ceil(usados*1.2))), 12*(porCirc ? acomodaCirc(sis.polos, circ.length) : difGen ? acomodaGen(sis.polos, circ.length) : acomoda(sis.polos, tamG)).rows); // mínimo 4 bipolares + 2 de reserva, regla 050-108

  // Metrado de cables por circuito: clave "sección|color|rol", con el uso de cada tramo
  const f = 1 + s.desp/100, cab = {}, usoK = {}, filasC = {}, p = s.punta;
  const add = (sec,col,m,rol,uso) => { if (m>0){ const key = sec+'|'+col+'|'+rol; cab[key] = (cab[key]||0) + m*f; (usoK[key] = usoK[key] || new Set()).add(uso);
    const fr = (filasC[uso] = filasC[uso] || {}); fr[col+'|'+rol] = (fr[col+'|'+rol]||0) + m*f; } };
  const B = s.sistema==='tri380' ? 'blanco' : 'negro';
  const nTomas = s.tomas + s.tomasC, cajasInt = s.intS + 2*s.conm;
  const nC = k => circ.filter(c => c.k===k).length;
  const subeTab = Math.max(s.H - s.hTab, 0);                 // del tablero al techo
  const baja = Math.max(s.H - s.hInt, 0) + 0.5*s.mLuz + 2*p;  // del techo al interruptor
  const troncalL = nC('L')*(s.mHome + subeTab + p) + s.luz*(s.mLuz + 2*p);
  const troncalT = nC('T')*(s.mHome + s.hTab + p) + s.tomas*(s.mToma + 2*s.hToma + 2*p)
                 + nC('C')*(s.mHome + s.hTab + p) + s.tomasC*(s.mToma + 2*s.hCoc + 2*p);
  const lEsp = s.mEsp + 2*p;
  // Colores por circuito según la regla 030-036 del CNE, iguales a los del dibujo del tablero
  const condC = sis.polos===2 ? ['rojo',B] : sis.polos===3 ? ['rojo','negro','azul'] : ['rojo','negro','azul','blanco'];
  const parG = g => sis.polos===2 ? [0,1] : sis.polos===3 ? [[0,1],[1,2],[0,2]][g%3] : [g%3,3];
  const grupoDe = i => { let a = 0; for (let g=0; g<tamG.length; g++){ a += tamG[g]; if (i < a) return g; } return 0; };
  const colsDe = i => (porCirc || difGen ? parFases(sis.polos, i) : parG(grupoDe(i))).map(j => condC[j]);
  const totL = circ.filter(x => x.k==='L').reduce((t,x) => t+x.pts, 0) || 1;
  circ.forEach((x,i) => {
    const [a,b] = colsDe(i), u = 'C'+(i+1)+' '+x.nombre.replace(/ \d+$/,'');
    if (x.k==='L'){
      const sh = x.pts/totL, tr = (s.mHome + subeTab + p) + x.pts*(s.mLuz + 2*p);
      add(x.sec,a, tr + sh*(s.intS + s.conm)*baja,'fase',u); add(x.sec,b,tr,'fase',u);
      add(x.sec,a, sh*(s.intS*baja + s.conm*(baja + 2*(2*baja + s.mLuz))),'ret',u);
      if (s.pozo) add(x.tierra,'verde',tr,'tierra',u);
    } else if (x.k==='T' || x.k==='C'){
      const tr = (s.mHome + s.hTab + p) + x.pts*(s.mToma + 2*(x.k==='T' ? s.hToma : s.hCoc) + 2*p);
      add(x.sec,a,tr,'fase',u); add(x.sec,b,tr,'fase',u); if (s.pozo) add(x.tierra,'verde',tr,'tierra',u);
    } else {
      add(x.sec,a,lEsp,'fase',u); add(x.sec,b,lEsp,'fase',u); if (s.pozo) add(x.tierra,'verde',lEsp,'tierra',u);
    }
  });
  condC.forEach(col => add(fs,col,s.dist,'fase','Alimentador medidor → tablero'));
  if (s.pozo) add(tGen,'verde',s.dist,'tierra','Barra de tierra → pozo a tierra');
  const cables = {}, ordenC = {rojo:0, negro:1, azul:2, blanco:3, verde:5}, peso = x => ordenC[x.col] + (x.rol==='ret' ? .5 : 0);
  Object.keys(cab).forEach(key => { const [sec,col,rol] = key.split('|'); (cables[sec] = cables[sec]||[]).push({col, rol, m:Math.ceil(cab[key]), uso:[...usoK[key]]}); });
  Object.values(cables).forEach(l => l.sort((x,y) => peso(x)-peso(y)));
  // Una fila por circuito: su interruptor, su calibre, lo que soporta el cable y los metros de cada color
  const linDe = u => Object.keys(filasC[u] || {}).map(k => { const [col,rol] = k.split('|'); return {col, rol, m:Math.ceil(filasC[u][k])}; }).sort((x,y) => peso(x)-peso(y));
  const cabCirc = circ.map((x,i) => { const u = 'C'+(i+1)+' '+x.nombre.replace(/ \d+$/,''); return {n:u, itm:x.itm, sec:x.sec, amp:ampDe(x.sec), lin:linDe(u)}; });
  cabCirc.push({n:'Alimentador medidor → tablero', itm:gen, sec:fs, amp:ampDe(fs), lin:linDe('Alimentador medidor → tablero')});
  if (s.pozo) cabCirc.push({n:'Barra de tierra → pozo a tierra', itm:0, sec:tGen, amp:0, lin:linDe('Barra de tierra → pozo a tierra')});

  const mTubo = troncalL + s.intS*baja + s.conm*(3*baja + s.mLuz) + troncalT + nEsp*lEsp;
  const tubos = Math.ceil(mTubo/3), tubosAlim = Math.ceil(s.dist/3), dAlim = fs<=10 ? 25 : 35;
  const rect = cajasInt + nTomas + nEsp;
  const completo = s.modo==='completo';

  // Lista de materiales
  const mat = [];
  let mCable = 0;
  Object.keys(cables).map(Number).sort((a,b)=>a-b).forEach(sec => {
    const m = cables[sec].reduce((t,x)=>t+x.m,0); mCable += m;
    mat.push({g:'Cables', d:'Cable THW-90 BH o libre de halógenos '+sec+' mm²', u:'m', q:m, pu:P.cable[sec]});
  });
  if (completo){
    mat.push({g:'Tubería y cajas', d:'Tubo PVC pesado 20 mm × 3 m', u:'und', q:tubos, pu:P.tubo20});
    mat.push({g:'Tubería y cajas', d:'Tubo PVC pesado '+dAlim+' mm × 3 m (alimentador)', u:'und', q:tubosAlim, pu:dAlim===25?P.tubo25:P.tubo35});
    mat.push({g:'Tubería y cajas', d:'Curvas PVC', u:'und', q:tubos+tubosAlim, pu:P.curva});
    mat.push({g:'Tubería y cajas', d:'Conectores a caja', u:'und', q:(s.luz+rect)*2, pu:P.conector});
    mat.push({g:'Tubería y cajas', d:'Caja octogonal (luz)', u:'und', q:s.luz, pu:P.octo});
    mat.push({g:'Tubería y cajas', d:'Caja rectangular', u:'und', q:rect, pu:P.rect});
    mat.push({g:'Tubería y cajas', d:'Pegamento para PVC', u:'und', q:Math.ceil((tubos+tubosAlim)/30), pu:P.pegamento});
  }
  mat.push({g:'Aparatos', d:'Interruptor simple con placa', u:'und', q:s.intS, pu:P.placaInt});
  mat.push({g:'Aparatos', d:'Interruptor de conmutación con placa', u:'und', q:2*s.conm, pu:P.placaConm});
  mat.push({g:'Aparatos', d:'Tomacorriente doble con tierra', u:'und', q:nTomas, pu:P.toma});
  mat.push({g:'Conexión y consumibles', d:'Cinta aislante 19 mm × 18 m', u:'rollo', q:Math.ceil((s.luz+nTomas+cajasInt)/12)+1, pu:P.cinta});
  mat.push({g:'Conexión y consumibles', d:'Cinta vulcanizante (zonas húmedas y alimentador)', u:'rollo', q:1, pu:P.vulc});
  mat.push({g:'Conexión y consumibles', d:'Conectores de empalme para cajas de luz', u:'und', q:s.luz*3, pu:P.empalme});
  mat.push({g:'Conexión y consumibles', d:'Terminales tipo pin para bornes del tablero', u:'und', q:circ.length*3 + nID*4, pu:P.pin});
  mat.push({g:'Conexión y consumibles', d:'Terminales de compresión para alimentador y tierra', u:'und', q:sis.polos+(s.pozo?2:0), pu:P.ojo});
  mat.push({g:'Conexión y consumibles', d:'Peine de conexión para tablero', u:'und', q:Math.ceil(usados/12), pu:P.peine});
  mat.push({g:'Conexión y consumibles', d:'Lubricante para pasar cable', u:'und', q:Math.ceil(mCable/400), pu:P.lubricante});
  mat.push({g:'Conexión y consumibles', d:'Cintillos de amarre, bolsa de 100', u:'und', q:1, pu:P.cintillos});
  mat.push({g:'Conexión y consumibles', d:'Etiquetas para identificar circuitos', u:'juego', q:1, pu:P.etiquetas});
  if (!s.tabExiste) mat.push({g:'Tablero', d:'Tablero empotrado '+tablero+' polos, riel DIN, barra de tierra', u:'und', q:1, pu:P.tablero[tablero] || tablero*17});
  mat.push({g:'Tablero', d:'Interruptor general '+sis.polos+'×'+gen+' A', u:'und', q:1, pu:itmPrecio(gen,sis.polos)});
  const precioID = a => a===25 ? 130 : a===40 ? P.id40 : P.id63, porID = {};
  if (porCirc) circ.forEach(x => porID[idDe(x.itm)] = (porID[idDe(x.itm)]||0)+1); else porID[idA] = nID;
  Object.keys(porID).map(Number).sort((a,b)=>a-b).forEach(a => mat.push({g:'Tablero', d:'Diferencial '+(difGen ? sis.polos : 2)+'×'+a+' A, 30 mA'+(difGen ? ' (general)' : ''), u:'und', q:porID[a], pu:precioID(a)*(difGen && sis.polos>2 ? 2 : 1)}));
  const porItm = {}; circ.forEach(c => porItm[c.itm] = (porItm[c.itm]||0)+1);
  Object.keys(porItm).map(Number).sort((a,b)=>a-b).forEach(a => mat.push({g:'Tablero', d:'Interruptor termomagnético 2×'+a+' A', u:'und', q:porItm[a], pu:itmPrecio(a,2)}));
  if (s.pozo) mat.push({g:'Puesta a tierra', d:'Pozo a tierra: varilla de cobre, cemento conductivo, caja de registro', u:'kit', q:1, pu:P.pozo});
  const matList = mat.filter(x => x.q>0);
  const matBase = matList.reduce((t,x)=>t+x.q*x.pu,0);
  const totMat = s.soloMO ? 0 : matBase;

  // Mano de obra por partidas, como cotiza un electricista: precio por punto y por dispositivo
  const puntos = s.luz + cajasInt + nTomas, disp = 1 + nID + circ.length;
  const en = s.piso ? ' ' + s.piso : '';
  const espNombres = Object.keys(ESP).filter(k => s[k]>0).map(k => ESP[k].n.toLowerCase()).join(', ');
  const mo = [
    {d:'Cableado de alimentador eléctrico principal', s:'Cableado y conexionado', q:1, pu:s.pAlim},
    {d:'Conexionado de tablero eléctrico '+tablero+' polos'+en, s:'Instalación de dispositivos eléctricos y conexión. Incluye mediciones, descarte de fallas y rotulado', q:disp, pu:s.pDisp},
    {d:'Salida de tomacorrientes'+en, s:'Cableado y conexionado. Incluye instalación de tomacorrientes', q:nTomas, pu:s.pp},
    {d:'Salida de luminaria'+en, s:'Cableado y conexionado. '+(s.pLum>0 ? 'La instalación de luminarias va en partida aparte' : 'No incluye instalación de luminarias'), q:s.luz, pu:s.pp},
    {d:'Salida de interruptores'+en, s:'Cableado y conexionado. Incluye instalación de interruptores', q:cajasInt, pu:s.pp},
    {d:'Alimentador para carga especial'+en, s:'Cableado y conexionado directo del tablero: '+espNombres, q:nEsp, pu:s.pEsp},
    {d:'Instalación de luminarias'+en, s:'Montaje y conexión de cada luminaria', q:s.pLum>0 ? s.luz : 0, pu:s.pLum},
    {d:'Entubado y colocación de cajas', s:'Por punto, solo en instalación completa', q:completo ? puntos + nEsp : 0, pu:s.pTubo},
    {d:'Construcción de pozo a tierra', s:'Excavación, varilla, tratamiento y conexión', q:s.pozo?1:0, pu:s.pPozo}
  ].filter(x => x.q>0);
  mo.forEach((x,i) => x.c = (i+1) + '.');
  const totMO = mo.reduce((t,x)=>t+x.q*x.pu,0);
  const directo = totMat + totMO, utilidad = directo*s.util/100, sub = directo + utilidad;
  const igv = s.igv ? sub*0.18 : 0, total = sub + igv;

  return {circ, basica, dCoc, dAgua, dAC, dOtras, demanda, I, gen, fs, caida, tGen, nID, idA, porCirc, difGen, idDe, usados, tablero, sis, tri,
    cables, B, mTubo, mCable, baja, completo, tubos, tubosAlim, dAlim, rect, cajasInt, nTomas, nEsp, matList, matBase, totMat, mo, totMO,
    directo, utilidad, sub, igv, total, puntos, disp, conTierra:!!s.pozo, cabCirc};
}

/* ---------- Esquema de conexión: qué cable va a cada interruptor ---------- */
const PW = 26, X0 = 18, GAP = 14, ROW_W = 340;   // 12 polos por fila, como los gabinetes comerciales
// Reparte los aparatos en filas de 12 polos: general primero, luego cada diferencial con sus termomagnéticos
function acomoda(polosGen, tam){
  let row = 0, x = X0 + polosGen*PW;
  const grupos = tam.map(n => {
    let dx = x + GAP;
    if (dx + 2*PW + (n ? GAP + n*2*PW : 0) > X0 + ROW_W + 0.5){ row++; dx = X0; }
    const xs = Array.from({length:n}, (_,i) => dx + 2*PW + GAP + i*2*PW);
    x = n ? xs[n-1] + 2*PW : dx + 2*PW;
    return {row, dx, xs, fin:x};
  });
  return {grupos, rows:row+1};
}
// Reparte los circuitos entre los diferenciales lo más parejo posible, máximo 3 por grupo
function reparteGrupos(n, g){ return Array.from({length:g}, (_,i) => Math.floor(n/g) + (i < n%g ? 1 : 0)); }
function gruposDif(c){
  const cond = c.sis.polos===2 ? ['rojo',c.B] : c.sis.polos===3 ? ['rojo','negro','azul'] : ['rojo','negro','azul','blanco'];
  const tam = reparteGrupos(c.circ.length, c.nID); let desde = 0;
  const par = g => c.sis.polos===2 ? [0,1] : c.sis.polos===3 ? [[0,1],[1,2],[0,2]][g%3] : [g%3,3];
  const grupos = [];
  for (let g=0;g<c.nID;g++){ grupos.push({par:par(g), circ:c.circ.map((x,i) => ({x,i})).slice(desde, desde+tam[g])}); desde += tam[g]; }
  const lay = acomoda(c.sis.polos, grupos.map(g => g.circ.length));
  grupos.forEach((g,i) => Object.assign(g, lay.grupos[i]));
  return {cond, grupos, rows:lay.rows};
}
function dibujaEsquema(c){
  if (c.porCirc) return dibujaPorCircuito(c);
  if (c.difGen) return dibujaGeneral(c);
  // Dibujo del gabinete: cada aparato con su forma, capacidad y rótulo; cada cable con su color hasta su tubo
  const HEX = {rojo:'#D62F2F', negro:'#161616', azul:'#2563EB', blanco:'#FFFFFF', verde:'#1E9E4A'}, ink = '#1B2430', BG = '#F3F1EA';
  const {cond, grupos, rows} = gruposDif(c), DH = 84, VW = 372, nc = cond.length;
  const abrev = {'Iluminación':'Luces', 'Tomacorrientes':'Tomas', 'Tomas cocina y lavandería':'Cocina', 'Ducha eléctrica':'Ducha', 'Electrobomba 1 HP':'Bomba',
    'Aire acondicionado':'Aire ac.', 'Cocina eléctrica o de inducción':'Cocina el.', 'Lavaseca o secadora':'Lavaseca'};

/* ---------- Tablero con un solo diferencial general (regla 040-216, incisos 1 y 2) ---------- */
// General termomagnético, luego el diferencial general, y de su salida todos los termomagnéticos
function acomodaGen(nc, n){
  const hueco = 4 + 5*nc, x1 = X0 + 2*nc*PW + 2*hueco, cap0 = Math.max(0, Math.floor((X0 + ROW_W + 0.5 - x1)/(2*PW))), bloques = [];
  let i = 0;
  do { const primero = !bloques.length, k = Math.min(primero ? cap0 : 6, n-i);
    bloques.push({desde:i, n:k, xs:Array.from({length:k}, (_,j) => (primero ? x1 : X0) + j*2*PW)}); i += k; } while (i < n);
  return {bloques, rows:bloques.length, hueco};
}
function dibujaGeneral(c){
  const {ink, BG, DH, corto, seg, salto, dot, tubo, riel, aparato, libre} = kitEsquema();
  const cond = c.sis.polos===2 ? ['rojo',c.B] : c.sis.polos===3 ? ['rojo','negro','azul'] : ['rojo','negro','azul','blanco'], nc = cond.length, VW = 372;
  const lay = acomodaGen(nc, c.circ.length), canal = 22 + 8*nc, filasExtra = Math.max(0, Math.round(c.tablero/12) - lay.rows);
  let yy = 38;
  const blk = lay.bloques.map(b => { const yT = yy + canal; yy = yT + DH + 90; return Object.assign(b, {yT}); });
  const extra = []; for (let r=0;r<filasExtra;r++){ extra.push(yy+12); yy += 112; }
  const yFin = yy, R = [], V = [], W = [], A = [], D = [], U = [], T = [], L = [];
  const gx = X0, gy = blk[0].yT, gw = nc*PW, gB = gy+DH, gt = k => gx+PW/2+k*PW;
  const dx = gx+gw+lay.hueco, dt = k => dx+PW/2+k*PW;
  // Entrada del medidor e interruptor general
  cond.forEach((col,k) => W.push(seg([[gt(k),12],[gt(k),gy+8]],col)));
  U.push(tubo(gx+gw/2-Math.max(21,gw/2-4), 4, Math.max(42,gw-8)));
  const letra = {rojo:'L1', negro:'L2', azul:'L3', blanco:'N'};
  cond.forEach((col,k) => T.push(`<text x="${gt(k)+5}" y="32" font-size="8" font-weight="700" fill="${ink}">${letra[col]}</text>`));
  A.push(aparato(gx,gy,nc,'gen','C'+c.gen,'General'), aparato(dx,gy,nc,'dif',c.idA+' A','Dif. gral'));
  const txt = gx + Math.max(gw,50) + 14;
  T.push(`<text x="${txt}" y="15" font-size="8.8" font-weight="700" fill="${ink}">Viene del medidor</text>
    <text x="${txt}" y="26" font-size="8.3" fill="#4B5563">Alimentador ${nc}×${c.fs} mm²</text>`);
  // Del general (sale por abajo) al diferencial general (entra por arriba)
  cond.forEach((col,k) => { const p = gB+10+6*(nc-1-k), r = gx+gw+3+(nc-1-k)*5, h = gy-12-8*k;
    W.push(seg([[gt(k),gB-8],[gt(k),p],[r,p],[r,h],[dt(k),h],[dt(k),gy+8]],col)); });
  // Salida del diferencial: a la derecha sube a los termomagnéticos de su fila; a la izquierda baja a las otras filas
  const base = gB+12+6*nc, prof = k => base+6*k, alto = (yT,k) => yT-12-8*(nc-1-k), sp = nc>3 ? 4 : 5, trX = k => 15-(nc-1-k)*sp, trFin = cond.map(() => 0);
  const usosDe = b => { const u = cond.map(() => []); for (let j=0;j<b.n;j++){ const [ia,ib] = parFases(nc, b.desde+j); u[ia].push(b.xs[j]+13); u[ib].push(b.xs[j]+39); } return u; };
  const u0 = usosDe(blk[0]);
  cond.forEach((col,k) => { if (!u0[k].length) return;
    const h = alto(gy,k), fin = Math.max(...u0[k]), r = dx+gw+3+k*5;
    W.push(salto([[dt(k)+5,prof(k)],[r-2,prof(k)]]));
    u0[k].forEach(x => { if (k<nc-1) W.push(salto([[x,h+5],[x,gy-7]])); });
    W.push(seg([[dt(k),gB-8],[dt(k),prof(k)],[r,prof(k)],[r,h],[fin,h],[fin,gy+8]],col));
    u0[k].forEach(x => { if (x!==fin){ W.push(seg([[x,h],[x,gy+8]],col)); D.push(dot(x,h,col)); } });
  });
  blk.forEach((b,bi) => {
    const {yT, xs, n} = b, yB = yT+DH;
    R.push(riel(yT));
    if (bi>0){ const u = usosDe(b);
      cond.forEach((col,k) => { if (!u[k].length) return;
        const h = alto(yT,k), fin = Math.max(...u[k]);
        u[k].forEach(x => { if (k<nc-1) W.push(salto([[x,h+5],[x,yT-7]])); });
        W.push(salto([[trX(k)+2.6,h],[X0-1,h]]), seg([[trX(k),h],[fin,h],[fin,yT+8]],col));
        D.push(dot(trX(k),h,col)); trFin[k] = Math.max(trFin[k], h);
        u[k].forEach(x => { if (x!==fin){ W.push(seg([[x,h],[x,yT+8]],col)); D.push(dot(x,h,col)); } });
      });
    }
    if (n){ V.push(seg([[366,yB+22],[xs[0]+26,yB+22],[xs[0]+26,yB+42]],'verde')); D.push(dot(366,yB+22,'verde')); }
    for (let j=0;j<n;j++){ const i = b.desde+j, it = c.circ[i], x = xs[j], [ia,ib] = parFases(nc,i), a = cond[ia], bb = cond[ib];
      if (j>0){ V.push(seg([[x+26,yB+22],[x+26,yB+42]],'verde')); D.push(dot(x+26,yB+22,'verde')); W.push(salto([[x+13,yB+16],[x+13,yB+28]])); }
      W.push(seg([[x+13,yB-8],[x+13,yB+42]],a), salto([[x+39,yB+16],[x+39,yB+28]]), seg([[x+39,yB-8],[x+39,yB+42]],bb));
      U.push(tubo(x+5,yB+38,42));
      A.push(aparato(x,yT,2,'itm','C'+it.itm,'C'+(i+1)));
      T.push(`<text x="${x+26}" y="${yB+64}" font-size="9" font-weight="700" text-anchor="middle" fill="${ink}">C${i+1}</text>
        <text x="${x+26}" y="${yB+74}" font-size="8" text-anchor="middle" fill="${ink}">${esc(corto(it.nombre))}</text>
        <text x="${x+26}" y="${yB+84}" font-size="8" text-anchor="middle" fill="#4B5563">${it.sec} mm²</text>`);
    }
    const fin = n ? xs[n-1]+2*PW : (bi===0 ? dx+gw : X0), usa = (bi===0 ? 2*nc : 0) + 2*n;
    for (let k=0;k<12-usa;k++){ const x = fin + (usa ? 4 : 0) + k*PW; if (x+PW <= X0+ROW_W+2) L.push(libre(x, yT)); }
  });
  extra.forEach(y => { R.push(riel(y)); for (let k=0;k<12;k++) L.push(libre(X0+k*PW, y)); });
  // Bajadas de la salida del diferencial a las filas de abajo
  cond.forEach((col,k) => { if (!trFin[k]) return;
    W.push(seg([[dt(k),gB-8],[dt(k),prof(k)],[trX(k),prof(k)],[trX(k),trFin[k]]],col));
    if (u0[k].length) D.push(dot(dt(k),prof(k),col)); });
  const yBar = yFin + 2, yCaja = yBar + 30;
  V.push(seg([[366, gB+22],[366,yBar+6],[352,yBar+6]],'verde'), seg([[236,yBar+13],[236,yCaja+14]],'verde'));
  if (!c.conTierra){ V.length = 0; for (let i=D.length-1;i>=0;i--) if (D[i].includes('fill="#1E9E4A"')) D.splice(i,1); }
  return `<svg viewBox="0 0 ${VW} ${yCaja+34}" width="100%" role="img" aria-label="Tablero con diferencial general" font-family="inherit">
    <rect x="1" y="9" width="${VW-2}" height="${yCaja-9}" rx="10" fill="${BG}" stroke="#8C8572" stroke-width="2"/>
    ${R.join('')}${L.join('')}${V.join('')}${W.join('')}${A.join('')}${D.join('')}${U.join('')}${T.join('')}
    ${c.conTierra ? `<rect x="200" y="${yBar}" width="156" height="13" rx="2" fill="#D4AF37" stroke="#8C7420"/>
    ${[0,1,2,3,4,5,6,7,8].map(k => `<circle cx="${212+k*16.5}" cy="${yBar+6.5}" r="2.6" fill="#F3E3A1" stroke="#8C7420" stroke-width=".7"/>`).join('')}
    <text x="192" y="${yBar+10}" font-size="8.8" font-weight="700" text-anchor="end" fill="${ink}">Barra de tierra</text>` : ''}
    <text x="12" y="${yBar+8}" font-size="8.6" font-weight="700" fill="${ink}">Tablero de ${c.tablero} polos</text>
    <text x="12" y="${yBar+19}" font-size="8" fill="#4B5563">${c.usados} usados, ${c.tablero-c.usados} libres</text>
    ${c.conTierra ? `${tubo(215,yCaja-7,42)}
    <path d="M224 ${yCaja+15}h24M228 ${yCaja+20}h16M232 ${yCaja+25}h8" stroke="#1E9E4A" stroke-width="2.4" stroke-linecap="round"/>
    <text x="256" y="${yCaja+22}" font-size="8.3" fill="${ink}">Pozo a tierra, cable ${c.tGen} mm²</text>` : ''}</svg>`;
}

/* ---------- Aparatos del tablero dibujados como los reales ---------- */
// Termomagnético: "C" + amperios, símbolo térmico-magnético y palanca negra. Diferencial: botón T, "A 30mA", símbolo y palanca verde.
function aparatoReal(x,y,polos,tipo,cap,rot){
  const DH = 84, w = polos*PW, ink = '#1B2430', cx = k => x+PW/2+k*PW;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${DH}" rx="3" fill="#F4F5F7" stroke="#6B7684" stroke-width="1.1"/>
    <rect x="${x+1.5}" y="${y+18}" width="${w-3}" height="${DH-36}" fill="#FFFFFF" stroke="#C3CCD7" stroke-width=".8"/>`;
  for (let k=1;k<polos;k++) s += `<path d="M${x+k*PW} ${y+2}v${DH-4}" stroke="#D3DAE2" stroke-width="1"/>`;
  for (let k=0;k<polos;k++) s += `<circle cx="${cx(k)}" cy="${y+9.5}" r="5.2" fill="#55606C" stroke="#2F3B4D" stroke-width=".8"/>
    <circle cx="${cx(k)}" cy="${y+DH-9.5}" r="5.2" fill="#55606C" stroke="#2F3B4D" stroke-width=".8"/>`;
  if (tipo==='dif'){
    const amp = String(cap).replace(/\s/g,'');
    s += `<rect x="${x+5}" y="${y+21}" width="15" height="11" rx="1.5" fill="#1E9E4A" stroke="#14532D" stroke-width=".8"/>
      <text x="${x+12.5}" y="${y+29.5}" font-size="8.5" font-weight="700" text-anchor="middle" fill="#0B2414">T</text>
      <text x="${x+3.5}" y="${y+42}" font-size="6.6" font-weight="700" fill="${ink}">${amp} 30mA</text>
      <ellipse cx="${x+13}" cy="${y+49}" rx="7" ry="3" fill="none" stroke="${ink}" stroke-width=".9"/>
      <path d="M${x+10} ${y+44}v10M${x+16} ${y+44}v10" stroke="${ink}" stroke-width=".9"/>
      <rect x="${x+w-12}" y="${y+22}" width="9" height="26" rx="2" fill="#1E9E4A" stroke="#14532D" stroke-width=".8"/>
      <rect x="${x+w-12}" y="${y+40}" width="9" height="8" rx="2" fill="#15803D"/>`;
  } else {
    s += `<text x="${cx(0)}" y="${y+31}" font-size="${String(cap).length>3 ? 8.5 : 10}" font-weight="700" text-anchor="middle" fill="${ink}">${cap}</text>`;
    if (polos>1){ const k = cx(1);
      s += `<path d="M${k-4} ${y+21}v3l2.5 1.6-2.5 1.6v4M${k+2} ${y+21}v3.5q3.5 1.4 0 2.8v3.4" fill="none" stroke="${ink}" stroke-width=".9"/>`; }
    s += `<rect x="${x+3}" y="${y+37}" width="${w-6}" height="15" rx="2" fill="#1F1F1F"/>`;
    for (let k=0;k<polos;k++) s += `<rect x="${cx(k)-6}" y="${y+40}" width="12" height="6" rx="1" fill="#1E9E4A"/><text x="${cx(k)}" y="${y+45}" font-size="4.6" font-weight="700" text-anchor="middle" fill="#FFFFFF">ON</text>`;
  }
  s += `<rect x="${x+3}" y="${y+55}" width="${w-6}" height="11" rx="2" fill="#FFF7C2" stroke="#B59B1A" stroke-width=".8"/>
    <text x="${x+w/2}" y="${y+63.3}" font-size="7.8" font-weight="700" text-anchor="middle" fill="${ink}">${rot}</text>`;
  return s;
}

// Tablas de metrado: por circuito (columnas por color) y totales por color y calibre
function metradoTablas(c){
  const NOM = {rojo:'Rojo', negro:'Negro', azul:'Azul', blanco:'Blanco'};
  const cols = ['rojo','negro','azul','blanco'].filter(k => c.cabCirc.some(r => r.lin.some(l => l.col===k && l.rol==='fase')));
  const hayRet = c.cabCirc.some(r => r.lin.some(l => l.rol==='ret')), hayT = c.cabCirc.some(r => r.lin.some(l => l.rol==='tierra'));
  const suma = (r, f) => { const t = r.lin.filter(f).reduce((s,l) => s+l.m, 0); return t ? fmt(t) : '–'; };
  const head = ['Circuito','Interruptor','Cable'].concat(cols.map(k => NOM[k]), hayRet ? ['Retorno'] : [], hayT ? ['Tierra'] : []);
  const body = c.cabCirc.map(r => [r.n.replace(' → ',' a '), r.itm ? r.itm+' A' : '–', r.sec+' mm²']
    .concat(cols.map(k => suma(r, l => l.col===k && l.rol==='fase')), hayRet ? [suma(r, l => l.rol==='ret')] : [], hayT ? [suma(r, l => l.rol==='tierra')] : []));
  // Los totales suman las mismas filas por circuito, para que cuadren exactamente
  const secs = [...new Set(c.cabCirc.map(r => r.sec))].sort((a,b) => a-b);
  const lins = s => c.cabCirc.filter(r => r.sec===s).flatMap(r => r.lin);
  const colsT = ['rojo','negro','azul','blanco','verde'].filter(k => secs.some(s => lins(s).some(l => l.col===k)));
  const NT = {rojo:'Rojo', negro:'Negro', azul:'Azul', blanco:'Blanco', verde:'Tierra (verde)'};
  const tot = (s,k) => lins(s).filter(l => l.col===k).reduce((t,l) => t+l.m, 0), totS = s => lins(s).reduce((t,l) => t+l.m, 0);
  const headT = ['Color'].concat(secs.map(s => s+' mm²'));
  const bodyT = colsT.map(k => [NT[k]].concat(secs.map(s => { const v = tot(s,k); return v ? fmt(v)+' m' : '–'; })));

/* Vista para el cliente: precios tal como se escriben. El IGV sale como línea final solo si está marcado.
   Si hay utilidad mayor a 0, va repartida dentro de cada precio y no aparece como línea. */
function paraCliente(c){
  const k = 1 + S.util/100, r2 = n => Math.round(n*100)/100;
  const fila = x => { const pu = r2(x.pu*k); return Object.assign({}, x, {pu, par:r2(x.q*pu)}); };
  const mo = c.mo.map(fila), mat = S.soloMO ? [] : c.matList.map(fila);
  const totMO = r2(mo.reduce((t,x)=>t+x.par,0)), totMat = r2(mat.reduce((t,x)=>t+x.par,0));
  const sub = r2(totMO+totMat), igv = S.igv ? r2(sub*0.18) : 0;
  return {mo, mat, totMO, totMat, sub, igv, total:r2(sub+igv)};
}

    'ALCANCE', '- '+S.luz+' puntos de luz, '+c.cajasInt+' interruptores', '- '+c.nTomas+' tomacorrientes dobles con tierra',
    '- '+c.nEsp+' circuito(s) especial(es)', '- Tablero de '+c.tablero+' polos, general '+c.sis.polos+'x'+c.gen+' A, '+c.nID+' diferencial(es) 30 mA',
    '- Alimentador '+c.sis.polos+'x'+c.fs+' mm² + tierra, '+S.dist+' m'];
  if (S.pozo) L.push('- Pozo a tierra');
  L.push('', 'MANO DE OBRA POR PARTIDAS');
  const v = paraCliente(c);
  v.mo.forEach(x => L.push(x.c+' '+x.d+': '+fmt(x.q)+' x '+money(x.pu)+' = '+money(x.par), '     ('+x.s+')'));
  L.push('', 'PRECIO', 'Mano de obra: '+money(v.totMO));
  if (!S.soloMO) L.push('Materiales: '+money(v.totMat));
  if (S.igv) L.push('Subtotal: '+money(v.sub), 'IGV 18 %: '+money(v.igv));
  L.push('TOTAL: '+money(v.total), '', S.soloMO ? 'No incluye materiales.' : 'Incluye materiales y mano de obra.', 'Precios referenciales, sujetos a visita técnica.');
  return L.join('\n');

async function descargaPDF(compartir){
  const msg = $('#pdf-msg'), say = t => { if (msg) msg.textContent = t; };
  if (!window.jspdf) return say('Falta la librería de PDF. Abre la app una vez con internet para que quede guardada.');
  try {
    const nombre = 'cotizacion-' + (S.cliente || 'electrica').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) + '.pdf';
    const file = new File([generaPDF(compute())], nombre, {type:'application/pdf'});
    if (compartir && PUEDE_COMPARTIR && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Cotización eléctrica'});
      return say('PDF enviado.');
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    say('PDF descargado: ' + nombre);
  } catch(e){
    say(e && e.name==='AbortError' ? 'Envío cancelado.' : 'No se pudo generar el PDF.');
  }
}

  ${fx('12. Cable de tomacorrientes, por el piso','Por circuito: recorrido al primer punto + altura del tablero + punta<br>Por toma: separación + 2 × altura de la toma + 2 puntas','Fase y neutro o segunda fase en 4 mm², tierra en 2.5 mm².')}
  ${fx('13. Colores de conductores','Fases: rojo (R), negro (S), azul (T) · Neutro: blanco o gris · Tierra: verde o verde/amarillo','Regla 030-036. En monofásico de dos conductores: negro y rojo, o negro y blanco.')}
  ${fx('14. Mano de obra','Puntos × precio por punto + cargas especiales + alimentador + dispositivos del tablero','Punto = cada salida de luminaria, interruptor o tomacorriente. Dispositivo = cada termomagnético o diferencial. Ahora: '+c.puntos+' puntos y '+c.disp+' dispositivos.')}
  ${fx('15. Calibre de cada circuito','Interruptor ≤ lo que soporta el cable · Tierra del mismo calibre que sus fases','Alumbrado 16 A con 2.5 mm². Tomacorrientes 20 A con 4 mm². Ducha 32 A con 6 mm². La tierra va del mismo calibre que el circuito, lo que cumple con holgura la sección mínima del CNE. Equivalencias aproximadas: 2.5 mm² ≈ 14 AWG, 4 mm² ≈ 12 AWG, 6 mm² ≈ 10 AWG, 10 mm² ≈ 8 AWG, 16 mm² ≈ 6 AWG.')}
  ${fx('16. Dónde va el diferencial','General termomagnético → diferencial de 30 mA → termomagnéticos de cada circuito','Regla 040-216: toda vivienda lleva diferencial, en el tablero y después del termomagnético general. Con más de 3 circuitos se agrupan de a tres, con un diferencial a la cabeza de cada grupo. También se permite uno por circuito.')}
  ${fx('17. Protección de personas','Diferencial de 30 mA + puesta a tierra ≤ 25 Ω','Reglas 020-132 y 060-712. Un termomagnético por circuito (150-400). Sección mínima 2.5 mm² (030-002).')}
  </div></div>
  <div class="warn">Herramienta de presupuesto rápido. Las reglas se tomaron de fuentes que citan el Código Nacional de Electricidad, Utilización 2006, no del texto oficial completo. Una obra real requiere la revisión de un ingeniero electricista colegiado.</div>`;
}

/* ---------- Ciclo de actualización ---------- */
let tabActual = 'datos';
try { tabActual = localStorage.getItem('cotiz-elec-tab') || 'datos'; } catch(e){}
const r1 = v => Math.round(v*10)/10;
function autoRecorridos(){
  const lim = v => Math.max(1.5, Math.min(6, r1(v)));
  if (S.auto){
    S.mLuz = lim(1.3*Math.sqrt(S.area/Math.max(S.luz,1)));
    S.mToma = lim(1.3*Math.sqrt(S.area/Math.max(S.tomas+S.tomasC,1)));
    S.mHome = r1(0.6*Math.sqrt(S.area/Math.max(S.pisos,1)));
  }
  ['mLuz','mToma','mHome'].forEach(k => { const el = $('#f-'+k); if (!el) return;
    if (S.auto) el.value = S[k];
    el.disabled = S.auto; document.querySelectorAll('button[data-k="'+k+'"]').forEach(b => b.disabled = S.auto); });
}
function update(){
  const activo = document.activeElement && document.activeElement.id;
  autoRecorridos();
  const ta = $('#tierra-aviso'); if (ta) ta.hidden = !!S.pozo;
  const ci = $('#f-igv'); if (ci) ci.checked = S.igv;
  if (!S.zonas[S.zona]) S.zona = 0;
  S.pp = S.zonas[S.zona].p;
  const zn = $('#z-nota'); if (zn) zn.textContent = 'Se cotiza con S/ '+S.pp+' por punto. Marca la zona de la obra; puedes cambiar los nombres y los precios.';
  const c = compute();
  $('#h-total').textContent = 'S/ ' + fmt(c.total);
  $('#h-lbl').textContent = S.soloMO ? 'Total (solo mano de obra)' : 'Total cotización';
  $('#h-meta').innerHTML = `${fmt(S.area)} m² · ${c.puntos} puntos<br>${fmt(c.demanda/1000,1)} kW · general ${c.sis.polos}×${c.gen} A`;
  drawTablero(c); drawMetrado(c); drawCotiza(c); drawFormulas(c);
  if (activo){ const el = document.getElementById(activo); if (el && el !== document.activeElement) el.focus(); }
  save();
}
function showTab(t){
  if (!$('#t-'+t)) t = 'datos';
  tabActual = t;
  document.querySelectorAll('.tab[id^="t-"]').forEach(el => el.hidden = el.id !== 't-'+t);
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#screen').scrollTop = 0;
  try { localStorage.setItem('cotiz-elec-tab', t); } catch(e){}
}
const setNum = (inp, v) => {
  const min = Number(inp.dataset.min); v = Number(inp.dataset.st)<1 ? r1(Number(v)) : Math.round(Number(v)); if (!isFinite(v)) v = min;
  v = Math.max(min, Math.min(9999, v)); S[inp.dataset.k] = v; return v;
};
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) return showTab(b.dataset.tab);
  if (b.dataset.step){ const inp = $('#f-'+b.dataset.k); inp.value = setNum(inp, Number(inp.value) + Number(b.dataset.step)*Number(inp.dataset.st)); return update(); }
  if (b.dataset.dif){ S.difModo = b.dataset.dif; document.querySelectorAll("#seg-dif button").forEach(x => x.setAttribute("aria-pressed", x===b)); return update(); }
  if (b.dataset.sis){ S.sistema = b.dataset.sis; document.querySelectorAll('#seg-sis button').forEach(x => x.setAttribute('aria-pressed', x===b)); return update(); }
  if (b.dataset.zstep){ const j = Number(b.dataset.zi), z = S.zonas[j]; z.p = Math.max(0, Math.min(999, z.p + Number(b.dataset.zstep))); $('#z-p-'+j).value = z.p; return update(); }
  if (b.dataset.tipo){ S.soloMO = b.dataset.tipo==='mo'; return update(); }
  if (b.id==='btn-pdf') return descargaPDF(false);
  if (b.id==='btn-share') return descargaPDF(true);
  if (b.id==='btn-actualizar'){
    const m = $('#ver-msg'); if (m) m.textContent = 'Buscando versión nueva…';
    const fin = () => { location.reload(); };
    if (registroSW) registroSW.update().then(() => setTimeout(fin, 1500), fin); else fin();
    return;
  }
  if (b.id==='btn-guardar'){
    const v = paraCliente(compute());
    LISTA.unshift({nombre:(S.cliente || 'Sin nombre') + (S.piso ? ' - ' + S.piso : ''), fecha:new Date().toLocaleDateString('es-PE'), total:v.total, datos:JSON.parse(JSON.stringify(S))});
    if (LISTA.length>60) LISTA.length = 60;
    avisoArch = guarda('cotiz-lista', LISTA) ? 'Cotización guardada.' : 'No se pudo guardar: el almacenamiento está lleno o bloqueado.';
    borrar = null; return drawArchivo();
  }
  if (b.id==='btn-nueva'){
    ['luz','intS','conm','tomas','tomasC'].concat(Object.keys(ESP)).forEach(k => S[k] = 0);
    S.cliente = ''; S.piso = 'Piso 1'; avisoArch = 'Cotización nueva. Se conservaron tus precios, zonas y alturas.';
    drawDatos(); update(); drawArchivo(); return showTab('datos');
  }
  if (b.dataset.abrir){
    const q = LISTA[Number(b.dataset.abrir)];
    if (q){ S = Object.assign({}, DEF, JSON.parse(JSON.stringify(q.datos))); avisoArch = ''; borrar = null; drawDatos(); update(); drawArchivo(); showTab('cotiza'); }
    return;
  }
  if (b.dataset.borrar){
    const i = Number(b.dataset.borrar);
    if (borrar===i){ LISTA.splice(i,1); guarda('cotiz-lista', LISTA); borrar = null; avisoArch = 'Cotización borrada.'; } else borrar = i;
    return drawArchivo();
  }
  if (b.dataset.modo){ S.modo = b.dataset.modo; document.querySelectorAll('#seg-modo button').forEach(x => x.setAttribute('aria-pressed', x===b)); return update(); }
  if (b.id==='btn-copy'){
    const txt = textoCotizacion(compute()), out = $('#copy-out');
    const fallback = () => { out.hidden = false; out.value = txt; out.focus(); out.select(); b.textContent = 'Selecciona el texto y cópialo'; };
    try { navigator.clipboard.writeText(txt).then(() => { b.textContent = 'Copiado'; }, fallback); } catch(err){ fallback(); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.neg){ NEG[t.dataset.neg] = t.value; guarda('cotiz-negocio', NEG); return; }
  if (t.dataset.text){ S[t.dataset.text] = t.value; return update(); }
  if (t.dataset.zsel){ S.zona = Number(t.dataset.zsel); return update(); }
  if (t.dataset.zn){ S.zonas[Number(t.dataset.zn)].n = t.value; return update(); }
  if (t.dataset.zp){ const v = Math.round(Number(t.value)); if (t.value !== '' && isFinite(v)) S.zonas[Number(t.dataset.zp)].p = Math.max(0, Math.min(999, v)); return update(); }
  if (t.dataset.chk){ S[t.dataset.chk] = t.checked; return update(); }
  if (t.dataset.k && t.value !== ''){ setNum(t, t.value); update(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.k && t.type==='number') t.value = setNum(t, t.value); });

/* ---------- Archivo: cotizaciones guardadas y datos del negocio ---------- */
let borrar = null, avisoArch = '';
function drawArchivo(){
  $('#t-archivo').innerHTML = `
  <div><h2>Cotización actual</h2><div class="tab" style="gap:8px">
    <button class="btn" type="button" id="btn-guardar">Guardar esta cotización</button>
    <button class="btn btn2" type="button" id="btn-nueva">Empezar una cotización nueva</button>
    <p class="note">${esc(avisoArch) || 'La cotización en curso se conserva sola. Guárdala para tenerla en la lista y volver a abrirla después.'}</p></div></div>
  <div><h2>Cotizaciones guardadas</h2>${LISTA.length ? `<div class="group">${LISTA.map((q,i) => `<div class="row"><div class="lbl"><b>${esc(q.nombre)}</b><span class="hint">${esc(q.fecha)} · ${money(q.total)}</span></div>
    <div class="step"><button type="button" class="mini" data-abrir="${i}">Abrir</button><button type="button" class="mini" data-borrar="${i}">${borrar===i ? '¿Seguro?' : 'Borrar'}</button></div></div>`).join('')}</div>` : '<p class="note">Todavía no hay cotizaciones guardadas.</p>'}</div>
  <div><h2>Mi negocio (sale en el PDF)</h2><div class="tab" style="gap:8px">
    <input class="text-in" id="n-nombre" data-neg="nombre" value="${esc(NEG.nombre)}" placeholder="Nombre o razón social" aria-label="Nombre o razón social">
    <input class="text-in" id="n-tel" data-neg="tel" inputmode="tel" value="${esc(NEG.tel)}" placeholder="Teléfono" aria-label="Teléfono">
    <input class="text-in" id="n-ruc" data-neg="ruc" inputmode="numeric" value="${esc(NEG.ruc)}" placeholder="RUC (opcional)" aria-label="RUC">
  </div></div>
  <p class="note">Todo se guarda solo en este celular. Si borras los datos del navegador o desinstalas la app, se pierde.</p>
  <div><h2>Versión de la app</h2><div class="tab" style="gap:8px">
    <button class="btn btn2" type="button" id="btn-actualizar">Buscar actualización</button>
    <p class="note" id="ver-msg">Tienes la versión ${APP_VERSION}. La app se actualiza sola al abrirla con internet.</p></div></div>`;
}

drawDatos(); update(); drawArchivo(); showTab(tabActual);
/* ---------- Actualización automática ---------- */
let registroSW = null;
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  const yaControlada = !!navigator.serviceWorker.controller; let recargada = false;
  // Cuando llega una versión nueva, la página se recarga sola para mostrarla
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (yaControlada && !recargada){ recargada = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => { registroSW = reg; reg.update().catch(() => {});
    // Al volver a la app desde segundo plano, busca si hay versión nueva
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
